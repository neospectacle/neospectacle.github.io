<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeoSpectacle Inc.</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', sans-serif;
}

body{
    color:#222;
    background:#f5f5f5;
}

/* HERO SECTION */

.hero{
    position:relative;
    height:100vh;
    background: url("hero.jpg") center/cover no-repeat;
    display:flex;
    align-items:center;
    justify-content:center;
}

.hero::before{
    content:"";
    position:absolute;
    inset:0;
    background: rgba(255,255,255,0.65); /* 배경 약하게 */
}

.hero-content{
    position:relative;
    max-width:1000px;
    text-align:center;
    padding:40px;
}

h1{
    font-size:56px;
    margin-bottom:20px;
    color:#0b2545;
}

h2{
    font-size:28px;
    margin-bottom:30px;
    color:#1b3b6f;
}

.features{
    font-size:20px;
    line-height:1.8;
    margin-bottom:30px;
}

.highlight{
    font-weight:bold;
    color:#0a5f8f;
}

.contact{
    font-size:18px;
    margin-top:20px;
}

.btn{
    display:inline-block;
    margin-top:30px;
    padding:14px 30px;
    background:#0a5f8f;
    color:white;
    text-decoration:none;
    border-radius:30px;
    font-weight:bold;
    transition:0.3s;
}

.btn:hover{
    background:#063f5c;
}
</style>
</head>

<body>

<section class="hero">
<div class="hero-content">

<h1>NeoSpectacle Inc.</h1>

<h2>Prescription-Ready Optical Platform for AI Smart Glasses</h2>

<div class="features">
Flat lens, <span class="highlight">2mm thickness platform</span><br>
Full FOV & Eye-relief<br>
Large eye-box, High transmittance<br>
High diopter range <span class="highlight">+10 ~ -10</span><br>
Large diameter over <span class="highlight">70mm</span>
</div>

<a href="mailto:hclee@neospectacle.com" class="btn">Contact: hclee@neospectacle.com</a>

</div>
</section>

</body>
</html>
